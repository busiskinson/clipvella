[project]
name = "clipforge-worker"
version = "0.1.0"
description = "ClipForge AI background worker: FFmpeg, Silero VAD, PySceneDetect, Groq Whisper, Gemini"
requires-python = ">=3.12,<3.13"
dependencies = [
  "supabase>=2.10",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "scenedetect[opencv-headless]>=0.6.4",
  "silero-vad>=5.1",
  "numpy>=1.26",
  "yt-dlp>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
